<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sp 10秒時間產生測驗</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:#fff;min-height:100vh;padding:16px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.container{max-width:400px;margin:0 auto}
.header{text-align:center;margin-bottom:24px}
.title{font-size:24px;font-weight:bold;margin-bottom:8px}
.subtitle{color:#9ca3af;font-size:14px}
.card{border-radius:8px;padding:24px;border:1px solid #374151}
.label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.input{width:100%;padding:12px;border:1px solid #4b5563;background:#1f2937;color:#fff;border-radius:6px;font-size:16px;margin-bottom:16px}
.input:focus{outline:none;border-color:#3b82f6}
.instructions{margin-bottom:24px}
.instructions h3{font-weight:500;margin-bottom:8px}
.instructions ul{color:#9ca3af;font-size:14px;line-height:1.5;padding-left:20px}
.instructions li{margin-bottom:4px}
.button{width:100%;padding:12px 16px;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;min-height:48px;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.button:active{transform:scale(.98)}
.primary{background:#3b82f6}.secondary{background:#6b7280}
.big{background:#f59e0b;font-size:20px;padding:24px;min-height:96px}
.big.running{background:#10b981}
.big:disabled{background:#374151;color:#9ca3af;cursor:default;transform:none}
.status{text-align:center;color:#9ca3af;font-size:14px;margin-bottom:16px}
.prompt{text-align:center;font-size:18px;line-height:1.5;margin-bottom:24px;min-height:81px}
.group{display:flex;gap:12px}.group .button{flex:1}
.center{text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-box{background:#111827;border:1px solid #374151;border-radius:8px;padding:24px;max-width:340px;width:100%}
.modal-box p{margin-bottom:20px;line-height:1.5}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 class="title">時間產生測驗</h1>
    <p class="subtitle">Time Production Task</p>
  </div>

  <div id="setup" class="card">
    <label class="label">受測者編號</label>
    <input type="text" id="subject-id" class="input" placeholder="輸入編號">
    <div class="instructions">
      <h3>測驗說明：</h3>
      <ul>
        <li>每次試驗請按下開始按鈕，並在心中估計10秒的時間長度，覺得10秒到了就按下結束按鈕</li>
        <li>請勿使用手錶、手機或其他方式計時，也請不要偷看任何有顯示時間的物件</li>
        <li>共10次試驗，每次試驗之間會有一段隨機長度的間隔</li>
        <li>準備好後按下下方按鈕進行1次練習，隨後開始正式測驗</li>
      </ul>
    </div>
    <button class="button primary" onclick="startSession()">開始測驗</button>
  </div>

  <div id="test" class="card hidden">
    <div class="status" id="trial-info"></div>
    <div class="prompt" id="prompt"></div>
    <button class="button big" id="main-btn" disabled>開始</button>
  </div>

  <div id="done" class="card hidden">
    <h2 class="center" style="margin-bottom:16px">測驗結束</h2>
    <p class="center" style="color:#9ca3af;margin-bottom:24px">感謝參與，請下載結果檔案</p>
    <div class="group">
      <button class="button primary" onclick="downloadResults()">下載結果</button>
      <button class="button secondary" onclick="askReset()">重新測驗</button>
    </div>
  </div>
</div>

<div id="confirm-modal" class="modal hidden">
  <div class="modal-box">
    <p>尚未下載的資料將會消失，確定要重新測驗嗎？</p>
    <div class="group">
      <button class="button secondary" onclick="closeModal()">取消</button>
      <button class="button primary" onclick="confirmReset()">確定</button>
    </div>
  </div>
</div>

<script>
const TARGET_MS=10000;   // 目標時間間隔
const TRIALS=10;         // 試驗次數
const ITI_MIN_MS=10000, ITI_MAX_MS=30000;      // 試驗間隔

function fresh(){return{subjectId:'',trial:0,phase:'idle',t0:0,results:[],start:null,end:null,timer:null};}
let S=fresh();

const $=id=>document.getElementById(id);
function show(id){['setup','test','done'].forEach(s=>$(s).classList.add('hidden'));$(id).classList.remove('hidden');}

function setReady(){
  S.phase='ready';
  $('trial-info').textContent=S.practice?'練習':`第 ${S.trial+1} / ${TRIALS} 次`;
  $('prompt').textContent=S.practice?'練習：請按下按鈕開始，並在心中估計10秒':'請按下按鈕開始，並在心中估計10秒';
  const b=$('main-btn');b.textContent='開始';b.disabled=false;b.classList.remove('running');
}

function startSession(){
  const id=$('subject-id').value.trim();
  if(!id){const el=$('subject-id');el.placeholder='請先輸入受測者編號';el.style.borderColor='#ef4444';el.focus();return;}
  S=fresh();S.subjectId=id;S.start=new Date().toISOString();
  show('test');setReady();
}

function onPress(){
  const now=performance.now();
  if(S.phase==='ready'){
    S.t0=now;S.phase='running';
    $('prompt').textContent='覺得10秒到了時請按下結束按鈕';
    const b=$('main-btn');b.textContent='結束';b.classList.add('running');
  }else if(S.phase==='practiceDone'){
    if(now-S.t0<800)return;
    S.practice=false;S.trial=0;S.curIti=null;setReady();
  }else if(S.phase==='running'&&S.practice){
    const dur=now-S.t0;S.t0=now;
    S.phase='practiceDone';
    $('prompt').textContent=`您估計的時間是 ${(dur/1000).toFixed(2)} 秒（目標為10秒）。接下來是正式測驗，不會提供秒數回饋。`;
    const b=$('main-btn');b.textContent='開始正式測驗';b.classList.remove('running');
  }else if(S.phase==='running'){
    S.results.push({trial:S.trial+1,produced:Math.round(now-S.t0),iti:S.curIti===null?null:Math.round(S.curIti),timestamp:new Date().toISOString()});
    S.phase='waiting';
    const b=$('main-btn');b.disabled=true;b.classList.remove('running');b.textContent='開始';
    if(S.trial>=TRIALS-1){
      $('prompt').textContent='已記錄';
      S.timer=setTimeout(finish,1000);
    }else{
      $('prompt').textContent='已記錄，請稍做休息準備下一次試驗';
      const iti=ITI_MIN_MS+Math.random()*(ITI_MAX_MS-ITI_MIN_MS);
      S.timer=setTimeout(()=>{S.trial++;setReady();},iti);
    }
  }
}
$('main-btn').addEventListener('pointerdown',e=>{e.preventDefault();onPress();});

function finish(){S.phase='done';S.end=new Date().toISOString();show('done');}
function askReset(){$('confirm-modal').classList.remove('hidden');}
function closeModal(){$('confirm-modal').classList.add('hidden');}
function confirmReset(){
  closeModal();clearTimeout(S.timer);S=fresh();
  $('subject-id').value='';show('setup');
}

async function downloadResults(){
  const fmt=s=>new Date(s).toLocaleString('zh-TW');
  const mean=S.results.length?(S.results.reduce((a,r)=>a+r.produced,0)/S.results.length).toFixed(2):'N/A';
  let t=`time production task results\n=============================\n\n`;
  t+=`Subject number: ${S.subjectId}\nTest start time: ${fmt(S.start)}\nTest end time: ${fmt(S.end)}\n`;
  t+=`Target interval: ${TARGET_MS} ms\nTotal trial number: ${S.results.length}\nMean produced interval: ${mean} ms\n\n`;
  t+=`trial-by-trial results:\ntrial_No. target(ms) produced(ms) error(ms)\n--------------------------------------\n`;
  S.results.forEach(r=>{t+=`${r.trial} ${TARGET_MS} ${r.produced} ${r.produced-TARGET_MS}\n`;});
  const filename=`time_production_${S.subjectId}_${new Date().toISOString().split('T')[0]}.txt`;
  try{
    const dl=await claude.use('downloads');
    if(dl){await dl.save({filename,data:t});return;}
  }catch(e){if(e&&e.code==='declined')return;console.error(e);}
  try{
    const url=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  }catch(e){console.error(e);}
}

document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
</body>
</html>
