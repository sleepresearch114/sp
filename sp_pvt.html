<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sp 反應時間測試</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#000;color:#fff;min-height:100vh;padding:16px;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.container{max-width:400px;margin:0 auto}
.header{text-align:center;margin-bottom:24px}
.title{font-size:24px;font-weight:bold;margin-bottom:8px}
.subtitle{color:#9ca3af;font-size:14px}
.card{background:#000;border-radius:8px;padding:24px;border:1px solid #374151}
.form-group{margin-bottom:16px}
.label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
.input{width:100%;padding:12px;border:1px solid #4b5563;background:#1f2937;color:#fff;border-radius:6px;font-size:16px}
.input:focus{outline:none;border-color:#3b82f6;box-shadow:0 0 0 2px rgba(59,130,246,.2)}
.instructions{margin-bottom:24px}
.instructions h3{font-weight:500;margin-bottom:8px}
.instructions ul{color:#9ca3af;font-size:14px;line-height:1.5;padding-left:20px}
.instructions li{margin-bottom:4px}
.button{width:100%;padding:12px 16px;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;color:#fff}
.button:active{transform:scale(.98)}
.button-primary{background:#3b82f6}.button-primary:hover{background:#2563eb}
.button-success{background:#10b981}.button-success:hover{background:#059669}
.button-warning{background:#f59e0b;font-size:18px;padding:16px}.button-warning:hover{background:#d97706}.button-warning:active{background:#b45309}
.button-secondary{background:#6b7280}.button-secondary:hover{background:#4b5563}
.test-area{margin-bottom:16px}
.status{text-align:center;margin-bottom:16px;color:#9ca3af;font-size:14px}
.red-box{width:50%;height:96px;margin:0 auto 16px;border:4px solid #ef4444;background:#fef2f2;border-radius:8px;position:relative;display:flex;align-items:center;justify-content:center}
.counter{position:absolute;inset:0;background:#fbbf24;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:bold;color:#000}
.message{text-align:center;margin-top:16px;font-size:14px;color:#9ca3af}
.button-group{display:flex;gap:12px}
.button-group .button{flex:1}
.text-center{text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal-box{background:#111827;border:1px solid #374151;border-radius:8px;padding:24px;max-width:340px;width:100%}
.modal-box p{margin-bottom:20px;line-height:1.5}
.hidden{display:none}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1 class="title">反應時間測試</h1>
    <p class="subtitle">Reaction Time Test</p>
  </div>

  <div id="setup-stage" class="card">
    <div class="form-group">
      <label class="label">👤 受測者編號</label>
      <input type="text" id="subject-id" class="input" placeholder="輸入編號">
    </div>
    <div class="instructions">
      <h3>測驗說明：</h3>
      <ul>
        <li>請注意紅色方框，當黃色計數器出現時立即按下按鈕</li>
        <li>請以慣用手之單一指頭按按鈕</li>
        <li>先進行5次練習，再進行正式測驗</li>
      </ul>
    </div>
    <button class="button button-primary" onclick="startPractice()">▶️ 開始練習</button>
  </div>

  <div id="ready-stage" class="card hidden">
    <h2 class="text-center" style="margin-bottom:16px">練習完成！</h2>
    <p class="text-center" style="color:#9ca3af;margin-bottom:24px">準備開始正式測驗</p>
    <button class="button button-success" onclick="startTest()">▶️ 開始正式測驗</button>
  </div>

  <div id="test-stage" class="card hidden">
    <div class="status"><div id="stage-info"></div></div>
    <div class="test-area">
      <div class="red-box">
        <div id="counter" class="counter hidden"></div>
        <div id="practice-message" class="text-center hidden">
          <div style="color:#9ca3af;font-size:18px;margin-bottom:8px" id="message-text">注意紅色方框，準備按鈕！</div>
        </div>
      </div>
      <button class="button button-warning" onclick="handleButtonPress()">按下停止計數器</button>
    </div>
    <div id="test-message" class="message hidden"></div>
  </div>

  <div id="results-stage" class="card hidden">
    <h2 class="text-center" style="margin-bottom:16px">測驗結束</h2>
    <p class="text-center" style="color:#9ca3af;margin-bottom:24px">感謝參與，請下載結果檔案</p>
    <div class="button-group">
      <button class="button button-primary" onclick="downloadResults()">📥 下載結果</button>
      <button class="button button-secondary" onclick="resetTest()">🔄 重新測驗</button>
    </div>
  </div>
</div>

<div id="confirm-modal" class="modal hidden">
  <div class="modal-box">
    <p>尚未下載的資料將會消失，確定要重新測驗嗎？</p>
    <div class="button-group">
      <button class="button button-secondary" onclick="cancelReset()">取消</button>
      <button class="button button-primary" onclick="confirmReset()">確定</button>
    </div>
  </div>
</div>

<script>
function freshState(){return{stage:'setup',subjectId:'',currentTrial:0,practiceCount:0,showCounter:false,startTime:null,sessionStartTime:null,sessionEndTime:null,message:'準備開始',results:[],counter:0,currentISI:0,waitingForResponse:false,testActive:false};}
let appState = freshState();
let timers = {counter:null,responseTimeout:null,isiTimeout:null,testTimeout:null,nextTrialTimeout:null};

function generateISI(){return Math.floor(Math.random()*3000)+1000;}
function clearAllTimers(){
  Object.values(timers).forEach(t=>{if(t){clearInterval(t);clearTimeout(t);}});
  Object.keys(timers).forEach(k=>timers[k]=null);
}
function showStage(stage){
  ['setup','ready','test','results'].forEach(s=>document.getElementById(s+'-stage').classList.add('hidden'));
  document.getElementById(stage+'-stage').classList.remove('hidden');
}

function startTrial(){
  if(appState.stage==='test'&&!appState.testActive)return;
  clearAllTimers();
  appState.showCounter=false;
  appState.message='注意紅色方框，準備按鈕！';
  appState.waitingForResponse=false;
  updateUI();
  const isi=generateISI();
  appState.currentISI=isi;
  timers.isiTimeout=setTimeout(()=>{
    if(appState.stage==='test'&&!appState.testActive)return;
    appState.showCounter=true;
    appState.counter=0;
    appState.startTime=Date.now();
    appState.waitingForResponse=true;
    appState.message='按下按鈕停止計數器！';
    updateUI();
    timers.counter=setInterval(()=>{
      appState.counter++;
      document.getElementById('counter').textContent=appState.counter;
    },1);
    timers.responseTimeout=setTimeout(handleNoResponse,30000);
  },isi);
}

function trialLabel(){return appState.stage==='practice'?`練習${appState.practiceCount+1}`:appState.currentTrial+1;}

function handleButtonPress(){
  if(appState.stage==='practice'||(appState.stage==='test'&&appState.testActive)){
    if(!appState.waitingForResponse){
      clearAllTimers();
      appState.showCounter=false;
      appState.message='太早按下！請等待黃色計數器出現';
      const result={trial:trialLabel(),isi:appState.currentISI,result:'false_start',rt:null,timestamp:new Date().toISOString()};
      if(appState.stage==='test')appState.results.push(result);
      updateUI();
      timers.nextTrialTimeout=setTimeout(moveToNextTrial,1000);
    }else{
      const reactionTime=Date.now()-appState.startTime;
      clearAllTimers();
      appState.showCounter=false;
      appState.message=appState.stage==='practice'?`反應時間: ${reactionTime} ms`:'已記錄反應';
      const result={trial:trialLabel(),isi:appState.currentISI,result:'success',rt:reactionTime,timestamp:new Date().toISOString()};
      if(appState.stage==='test')appState.results.push(result);
      updateUI();
      timers.nextTrialTimeout=setTimeout(moveToNextTrial,1000);
    }
  }
}

function handleNoResponse(){
  clearAllTimers();
  appState.showCounter=false;
  appState.message='無反應！';
  appState.waitingForResponse=false;
  const result={trial:trialLabel(),isi:appState.currentISI,result:'no_response',rt:null,timestamp:new Date().toISOString()};
  if(appState.stage==='test')appState.results.push(result);
  updateUI();
  timers.nextTrialTimeout=setTimeout(moveToNextTrial,1000);
}

function moveToNextTrial(){
  if(appState.stage==='practice'){
    if(appState.practiceCount<4){appState.practiceCount++;startTrial();}
    else{appState.message='練習結束！點擊開始正式測驗';appState.stage='ready';showStage('ready');}
  }else if(appState.stage==='test'&&appState.testActive){
    if(appState.currentTrial<39){appState.currentTrial++;startTrial();}
    else endTest();
  }
}

function startPractice(){
  const id=document.getElementById('subject-id').value.trim();
  if(!id){const el=document.getElementById('subject-id');el.placeholder='請先輸入受測者編號';el.style.borderColor='#ef4444';el.focus();return;}
  appState.subjectId=id;
  appState.stage='practice';
  appState.practiceCount=0;
  showStage('test');
  startTrial();
}

function startTest(){
  appState.stage='test';
  appState.currentTrial=0;
  appState.results=[];
  appState.sessionStartTime=new Date().toISOString();
  appState.testActive=true;
  showStage('test');
  startTrial();
}

function endTest(){
  clearAllTimers();
  appState.testActive=false;
  appState.sessionEndTime=new Date().toISOString();
  appState.stage='results';
  appState.showCounter=false;
  appState.waitingForResponse=false;
  appState.message='測驗結束！';
  showStage('results');
}

function resetTest(){document.getElementById('confirm-modal').classList.remove('hidden');}
function cancelReset(){document.getElementById('confirm-modal').classList.add('hidden');}
function confirmReset(){
  cancelReset();
  clearAllTimers();
  appState=freshState();
  document.getElementById('subject-id').value='';
  showStage('setup');
}

function updateUI(){
  const counter=document.getElementById('counter');
  const pm=document.getElementById('practice-message');
  const mt=document.getElementById('message-text');
  const tm=document.getElementById('test-message');
  const si=document.getElementById('stage-info');
  if(appState.showCounter){
    counter.classList.remove('hidden');
    counter.textContent=appState.counter;
    pm.classList.add('hidden');
  }else{
    counter.classList.add('hidden');
    if(appState.stage==='practice'){pm.classList.remove('hidden');mt.textContent=appState.message;}
    else pm.classList.add('hidden');
  }
  si.textContent=appState.stage==='practice'?`練習 ${appState.practiceCount+1}`:'正式測驗進行中...';
  if(appState.stage==='practice'||(appState.stage==='test'&&(appState.message.includes('已記錄')||appState.message.includes('太早')||appState.message.includes('無反應')))){
    tm.classList.remove('hidden');
    tm.textContent=appState.message;
  }else tm.classList.add('hidden');
}

async function downloadResults(){
  const ok=appState.results.filter(r=>r.result==='success');
  const avgRT=ok.length>0?(ok.reduce((s,r)=>s+r.rt,0)/ok.length).toFixed(2):'N/A';
  let t=`reaction time test results\n========================\n\n`;
  t+=`Subject number: ${appState.subjectId}\n`;
  t+=`Test start time: ${new Date(appState.sessionStartTime).toLocaleString('zh-TW')}\n`;
  t+=`Test end time: ${new Date(appState.sessionEndTime).toLocaleString('zh-TW')}\n`;
  t+=`Total trial number: ${appState.results.length}\n`;
  t+=`success trial number: ${ok.length}\n`;
  t+=`mean reaction time: ${avgRT} ms\n\n`;
  t+=`trial-by-trial results:\ntrial_No. ISI(ms) Response reaction_time(ms)\n--------------------------------------\n`;
  appState.results.forEach(r=>{
    const rt=r.result==='success'?'correct':r.result==='false_start'?'false_start':'no_response';
    t+=`${r.trial} ${r.isi} ${rt} ${r.rt||'-'}\n`;
  });
  const filename=`reaction_time_${appState.subjectId}_${new Date().toISOString().split('T')[0]}.txt`;
  try{
    const dl=await claude.use('downloads');
    if(dl){await dl.save({filename,data:t});return;}
  }catch(e){
    if(e&&e.code==='declined')return;
    console.error(e);
  }
  try{
    const blob=new Blob([t],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    console.error('下載失敗:',e);
    alert('下載失敗，請重新嘗試。');
  }
}

document.addEventListener('DOMContentLoaded',()=>showStage('setup'));
document.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
</script>
</body>
</html>
